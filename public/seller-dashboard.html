<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Looma Hub — Painel do Lojista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { looma: { indigo: '#6366F1', coral: '#F97316', ink: '#1e1b4b' } },
          fontFamily: { display: ['Sora', 'sans-serif'], body: ['DM Sans', 'sans-serif'] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/looma.css" />
</head>
<body class="font-body text-looma-ink">
  <header class="looma-header">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/" class="brand-word text-2xl">Looma</a>
      <span class="text-xs font-semibold uppercase tracking-wider text-looma-indigo bg-indigo-50 px-2 py-1 rounded">Hub</span>
      <div class="ml-auto flex items-center gap-3">
        <a href="/" class="text-sm text-slate-500 hover:text-looma-indigo">Vitrine</a>
        <span id="seller-user" class="text-sm font-medium"></span>
        <button id="btn-logout" type="button" class="text-sm text-slate-500 hover:text-red-600">Sair</button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <!-- Onboarding: abrir loja -->
    <section id="panel-onboarding" class="hidden max-w-lg mx-auto fade-up">
      <h1 class="font-display text-2xl font-bold mb-2">Abra sua loja na Looma</h1>
      <p class="text-sm text-slate-500 mb-6">Crie sua vitrine no Looma Hub e receba vendas via Looma Pay.</p>
      <form id="form-store" class="space-y-4 bg-white border border-slate-200 rounded-xl p-5">
        <label class="block text-sm">
          Nome da loja
          <input name="name" required minlength="2" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-looma-indigo" />
        </label>
        <label class="block text-sm">
          CPF ou CNPJ
          <input name="document" required class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-looma-indigo" placeholder="Somente números" />
        </label>
        <label class="block text-sm">
          Descrição
          <textarea name="description" rows="3" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-looma-indigo"></textarea>
        </label>
        <label class="block text-sm">
          Logo
          <input name="logo" type="file" accept="image/*" class="mt-1 w-full text-sm" />
        </label>
        <button type="submit" class="btn-coral w-full font-semibold py-2.5 rounded-lg">Criar loja no Looma Hub</button>
      </form>
      <p id="onboard-msg" class="mt-3 text-sm text-red-600 hidden"></p>
    </section>

    <!-- Dashboard lojista -->
    <section id="panel-dashboard" class="hidden space-y-8 fade-up">
      <div class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="font-display text-2xl font-bold" id="store-title">Looma Hub</h1>
          <p class="text-sm text-slate-500">
            URL pública:
            <a id="store-url" href="#" class="text-looma-indigo font-medium"></a>
          </p>
        </div>
        <button id="btn-open-product-modal" type="button" class="btn-coral font-semibold px-4 py-2 rounded-lg text-sm">
          + Novo produto
        </button>
      </div>

      <div class="grid sm:grid-cols-3 gap-4">
        <div class="bg-white border border-slate-200 rounded-xl p-4">
          <p class="text-xs uppercase tracking-wide text-slate-500">Saldo Looma Pay</p>
          <p id="stat-wallet" class="stat-value text-2xl text-looma-indigo mt-1">R$&nbsp;0,00</p>
        </div>
        <div class="bg-white border border-slate-200 rounded-xl p-4">
          <p class="text-xs uppercase tracking-wide text-slate-500">Total de vendas (líquido)</p>
          <p id="stat-sales" class="stat-value text-2xl mt-1">R$&nbsp;0,00</p>
        </div>
        <div class="bg-white border border-slate-200 rounded-xl p-4">
          <p class="text-xs uppercase tracking-wide text-slate-500">Pedidos</p>
          <p id="stat-orders" class="stat-value text-2xl mt-1">0</p>
        </div>
      </div>

      <div>
        <h2 class="font-display font-bold text-lg mb-3">Seus produtos</h2>
        <div class="overflow-x-auto bg-white border border-slate-200 rounded-xl">
          <table class="w-full text-sm text-left">
            <thead class="bg-slate-50 text-slate-500">
              <tr>
                <th class="px-4 py-3 font-medium">Produto</th>
                <th class="px-4 py-3 font-medium">Preço</th>
                <th class="px-4 py-3 font-medium">Estoque</th>
                <th class="px-4 py-3 font-medium">Status</th>
                <th class="px-4 py-3 font-medium"></th>
              </tr>
            </thead>
            <tbody id="products-tbody"></tbody>
          </table>
        </div>
      </div>

      <div>
        <h2 class="font-display font-bold text-lg mb-3">Sub-pedidos para despacho</h2>
        <div id="orders-list" class="space-y-3"></div>
      </div>
    </section>
  </main>

  <div id="product-modal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="bg-white rounded-xl w-full max-w-md p-5 border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-display font-bold text-lg">Cadastrar produto</h3>
        <button id="btn-close-product-modal" type="button" class="text-slate-500 text-sm">Fechar</button>
      </div>
      <form id="form-product" class="space-y-3">
        <label class="block text-sm">
          Nome
          <input name="name" required class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-looma-indigo" />
        </label>
        <label class="block text-sm">
          Descrição
          <textarea name="description" rows="2" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-looma-indigo"></textarea>
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="block text-sm">
            Preço (R$)
            <input name="price" type="number" step="0.01" min="0.01" required class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-looma-indigo" />
          </label>
          <label class="block text-sm">
            Estoque
            <input name="stock" type="number" min="0" required value="1" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-looma-indigo" />
          </label>
        </div>
        <label class="block text-sm">
          Categoria
          <select name="category_id" id="product-category" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 outline-none focus:border-looma-indigo">
            <option value="">Sem categoria</option>
          </select>
        </label>
        <label class="block text-sm">
          Foto
          <input name="image" type="file" accept="image/*" class="mt-1 w-full text-sm" />
        </label>
        <button type="submit" class="btn-indigo w-full font-semibold py-2.5 rounded-lg">Salvar produto</button>
      </form>
      <p id="product-msg" class="mt-2 text-sm text-red-600 hidden"></p>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="/js/api.js"></script>
  <script src="/js/seller.js"></script>
</body>
</html>
