<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Looma — Onde todas as lojas se conectam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            looma: { indigo: '#6366F1', coral: '#F97316', ink: '#1e1b4b' }
          },
          fontFamily: {
            display: ['Sora', 'sans-serif'],
            body: ['DM Sans', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/looma.css" />
</head>
<body class="font-body text-looma-ink">
  <header class="looma-header">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <a href="/" class="brand-word text-2xl shrink-0">Looma</a>
      <form id="search-form" class="flex-1 min-w-[200px] order-3 sm:order-none w-full sm:w-auto">
        <input
          id="search-input"
          type="search"
          placeholder="Buscar produtos ou lojas..."
          class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-looma-indigo"
        />
      </form>
      <nav class="flex items-center gap-2 ml-auto">
        <a href="/seller-dashboard.html" class="btn-indigo text-sm font-semibold px-3 py-2 rounded-lg whitespace-nowrap">
          Venda na Looma
        </a>
        <a id="nav-auth" href="/login.html" class="text-sm font-medium text-slate-600 hover:text-looma-indigo px-2 py-2">
          Entrar
        </a>
        <button id="btn-cart" type="button" class="relative text-sm font-semibold px-3 py-2 rounded-lg border border-slate-200 bg-white hover:border-looma-indigo">
          Carrinho
          <span id="cart-badge" class="absolute -top-1.5 -right-1.5 min-w-[1.25rem] h-5 px-1 rounded-full bg-looma-coral text-white text-xs flex items-center justify-center hidden">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <section class="max-w-6xl mx-auto px-4 pt-10 pb-6 fade-up">
      <p class="brand-word text-4xl sm:text-5xl mb-3">Looma</p>
      <h1 class="font-display text-xl sm:text-2xl text-slate-700 font-semibold max-w-xl">
        Onde todas as lojas se conectam.
      </h1>
      <p class="mt-3 text-slate-500 max-w-lg text-sm sm:text-base">
        Sua loja, nosso universo. Compre de vários vendedores em um só carrinho.
      </p>
    </section>

    <section class="max-w-6xl mx-auto px-4 pb-4">
      <div id="category-filters" class="flex flex-wrap gap-2"></div>
    </section>

    <section class="max-w-6xl mx-auto px-4 pb-16">
      <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
      <p id="products-empty" class="hidden text-center text-slate-500 py-16">Nenhum produto encontrado.</p>
      <p id="products-loading" class="text-center text-slate-500 py-16">Carregando catálogo Looma...</p>
    </section>
  </main>

  <div id="drawer-overlay" class="drawer-overlay"></div>
  <aside id="cart-drawer" class="cart-drawer" aria-label="Carrinho Looma">
    <div class="flex items-center justify-between px-4 py-4 border-b border-slate-200">
      <h2 class="font-display font-bold text-lg">Seu carrinho</h2>
      <button id="btn-close-cart" type="button" class="text-slate-500 hover:text-looma-ink text-sm">Fechar</button>
    </div>
    <div id="cart-body" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
    <div class="border-t border-slate-200 p-4 space-y-3">
      <div class="flex justify-between font-semibold">
        <span>Total</span>
        <span id="cart-total">R$&nbsp;0,00</span>
      </div>
      <label class="block text-sm text-slate-600">
        Endereço de entrega
        <textarea id="shipping-address" rows="2" class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-looma-indigo" placeholder="Rua, número, bairro, cidade, CEP"></textarea>
      </label>
      <button id="btn-checkout" type="button" class="btn-coral w-full font-semibold py-2.5 rounded-lg">
        Finalizar compra
      </button>
    </div>
  </aside>

  <div id="toast" class="toast" role="status"></div>

  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/storefront.js"></script>
</body>
</html>
