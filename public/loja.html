<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja na Looma</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { looma: { indigo: '#6366F1', coral: '#F97316', ink: '#1e1b4b' } },
          fontFamily: { display: ['Sora', 'sans-serif'], body: ['DM Sans', 'sans-serif'] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/looma.css" />
</head>
<body class="font-body text-looma-ink">
  <header class="looma-header">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
      <a href="/" class="brand-word text-2xl">Looma</a>
      <a href="/" class="ml-auto text-sm text-slate-500 hover:text-looma-indigo">Voltar à vitrine</a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="store-header" class="fade-up mb-8 flex gap-4 items-center">
      <div id="store-logo" class="w-16 h-16 rounded-xl bg-indigo-50 overflow-hidden shrink-0"></div>
      <div>
        <h1 id="store-name" class="font-display text-2xl font-bold">Carregando...</h1>
        <p id="store-desc" class="text-sm text-slate-500 mt-1"></p>
      </div>
    </div>
    <div id="store-products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    <p id="store-empty" class="hidden text-center text-slate-500 py-12">Esta loja ainda não tem produtos.</p>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script src="/js/api.js"></script>
  <script src="/js/cart.js"></script>
  <script>
    (() => {
      const slug = window.location.pathname.split('/').filter(Boolean).pop();
      const toastEl = document.getElementById('toast');

      function toast(msg, type = 'success') {
        toastEl.textContent = msg;
        toastEl.className = `toast show ${type}`;
        setTimeout(() => toastEl.classList.remove('show'), 2500);
      }

      async function load() {
        try {
          const data = await LoomaAPI.get(`/api/stores/${encodeURIComponent(slug)}`);
          const store = data.store;
          document.title = `${store.name} · Looma`;
          document.getElementById('store-name').textContent = store.name;
          document.getElementById('store-desc').textContent = store.description || 'Loja na Looma';
          const logo = document.getElementById('store-logo');
          if (store.logo_url) {
            logo.innerHTML = `<img src="${escapeHtml(store.logo_url)}" alt="" class="w-full h-full object-cover" />`;
          }

          const products = data.products || [];
          const grid = document.getElementById('store-products');
          if (!products.length) {
            document.getElementById('store-empty').classList.remove('hidden');
            return;
          }

          grid.innerHTML = products
            .map(
              (p) => `
            <article class="product-tile rounded-xl overflow-hidden flex flex-col">
              <div class="aspect-square bg-slate-100">
                ${
                  p.image_url
                    ? `<img src="${escapeHtml(p.image_url)}" alt="" class="w-full h-full object-cover" />`
                    : ''
                }
              </div>
              <div class="p-3 flex flex-col flex-1 gap-2">
                <h3 class="text-sm font-semibold">${escapeHtml(p.name)}</h3>
                <p class="font-display font-bold text-looma-indigo mt-auto">${formatBRL(p.price)}</p>
                <button type="button" class="btn-coral text-sm font-semibold py-2 rounded-lg"
                  data-pid="${p.id}"
                  data-name="${escapeHtml(p.name)}"
                  data-price="${p.price}"
                  data-image="${escapeHtml(p.image_url || '')}">
                  Adicionar
                </button>
              </div>
            </article>`
            )
            .join('');

          grid.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-pid]');
            if (!btn) return;
            LoomaCart.add({
              id: Number(btn.getAttribute('data-pid')),
              name: btn.getAttribute('data-name'),
              price: Number(btn.getAttribute('data-price')),
              image_url: btn.getAttribute('data-image'),
              store_id: store.id,
              store_name: store.name,
              store_slug: store.slug
            });
            toast('Adicionado ao carrinho');
          });
        } catch (err) {
          document.getElementById('store-name').textContent = 'Loja não encontrada';
          document.getElementById('store-desc').textContent = err.message;
        }
      }

      load();
    })();
  </script>
</body>
</html>
